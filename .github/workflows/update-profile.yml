name: Update profile

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Générer les fichiers
        run: python scripts/build_profile.py

      - name: Enregistrer les changements
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Mise à jour du profil"
          file_pattern: "*.svg data/contributions.json"
